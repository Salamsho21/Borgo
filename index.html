<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BorGo — Боркашонии зуд</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: { colors: { ink: '#0F1B2D', road: '#F2B705', mist: '#EEF2F6' } } } };
</script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#EEF2F6; color:#0F1B2D; }
  .live-dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  @keyframes pop { from { transform: translateY(12px); opacity:0 } to { transform:none; opacity:1 } }
  .toast { animation: pop .25s ease-out; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid #0F1B2D; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .live-dot, .toast { animation:none } }
</style>
</head>
<body class="min-h-screen">

<header class="sticky top-0 z-20 bg-ink text-white">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <span class="w-9 h-9 rounded-lg bg-road text-ink flex items-center justify-center" id="logo"></span>
      <span class="text-lg font-bold tracking-tight">BorGo</span>
    </div>
    <div class="flex bg-white/10 rounded-lg p-1" role="tablist" aria-label="Реҷаи интерфейс">
      <button id="tab-customer" role="tab" class="px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold flex items-center gap-2"></button>
      <button id="tab-driver" role="tab" class="px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold flex items-center gap-2"></button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <!-- CUSTOMER -->
  <section id="view-customer" class="grid lg:grid-cols-5 gap-6">
    <form id="order-form" class="lg:col-span-3 bg-white rounded-xl border border-slate-200 p-5 sm:p-6 space-y-6" novalidate>
      <div>
        <h1 class="text-xl font-bold">Фармоиши нав</h1>
        <p class="text-sm text-slate-500 mt-1">Масир ва мошинро интихоб кунед — нарх ҳамон лаҳза ҳисоб мешавад.</p>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-sm font-semibold flex items-center gap-1.5 mb-1.5"><span data-i="pin"></span>Аз куҷо</span>
          <select id="from" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5"></select>
        </label>
        <label class="block">
          <span class="text-sm font-semibold flex items-center gap-1.5 mb-1.5"><span data-i="flag"></span>Ба куҷо</span>
          <select id="to" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5"></select>
        </label>
      </div>

      <div>
        <span class="text-sm font-semibold block mb-2">Намуди мошин</span>
        <div id="vehicles" class="grid sm:grid-cols-3 gap-3"></div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-sm font-semibold flex items-center gap-1.5 mb-1.5"><span data-i="weight"></span>Вазни бор (кг)</span>
          <input id="weight" type="number" min="1" step="1" inputmode="numeric" placeholder="Масалан, 800" class="w-full rounded-lg border border-slate-300 px-3 py-2.5">
          <span id="weight-hint" class="text-xs text-slate-500 mt-1 block"></span>
        </label>
        <label class="block">
          <span class="text-sm font-semibold flex items-center gap-1.5 mb-1.5"><span data-i="note"></span>Шарҳ барои ронанда</span>
          <textarea id="note" rows="2" maxlength="200" placeholder="Суроға, телефон, шартҳои бор" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 resize-none"></textarea>
        </label>
      </div>

      <div>
        <span class="text-sm font-semibold block mb-2">Тарзи пардохт</span>
        <div id="payments" class="grid sm:grid-cols-3 gap-3"></div>
      </div>

      <div class="rounded-xl bg-ink text-white p-4 flex items-center justify-between gap-4">
        <div>
          <div class="text-sm text-white/70">Нархи тахминӣ</div>
          <div class="text-2xl font-bold" id="price">—</div>
          <div class="text-xs text-white/60 mt-0.5" id="price-meta">Масир ва вазнро пур кунед</div>
        </div>
        <button type="submit" class="shrink-0 bg-road text-ink font-bold rounded-lg px-5 py-3 flex items-center gap-2 hover:brightness-95"><span data-i="send"></span>Фармоиш додан</button>
      </div>
      <p id="form-error" class="text-sm text-red-600 hidden" role="alert"></p>
    </form>

    <aside class="lg:col-span-2">
      <h2 class="text-lg font-bold mb-3">Фармоишҳои ман</h2>
      <div id="my-orders" class="space-y-3"></div>
    </aside>
  </section>

  <!-- DRIVER -->
  <section id="view-driver" class="hidden space-y-6">
    <div class="grid grid-cols-3 gap-3" id="driver-stats"></div>
    <div id="active-panel"></div>
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 live-dot"></span>Фармоишҳои фаъол</h2>
        <span class="text-sm text-slate-500" id="live-count"></span>
      </div>
      <div id="live-orders" class="grid md:grid-cols-2 gap-3"></div>
    </div>
  </section>
</main>

<div id="toasts" class="fixed bottom-4 inset-x-4 sm:inset-x-auto sm:right-4 sm:w-80 z-30 space-y-2"></div>

<script>
(function () {
  'use strict';

  /* ---------- Icons (Lucide-style SVG) ---------- */
  var P = {
    truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
    pkg: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
    weight: '<circle cx="12" cy="5" r="3"/><path d="M6.5 8a2 2 0 0 0-1.905 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.925-2.54L19.4 9.5A2 2 0 0 0 17.48 8Z"/>',
    note: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    card: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
    building: '<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    route: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    coins: '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/>',
    play: '<polygon points="6 3 20 12 6 21 6 3"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'
  };
  function icon(n, c) {
    return '<svg xmlns="http://www.w3.org/2000/svg" class="' + (c || 'w-4 h-4') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[n] || '') + '</svg>';
  }

  /* ---------- Data ---------- */
  var CITIES = {
    'Душанбе': [38.5598, 68.787], 'Хуҷанд': [40.2826, 69.6226], 'Бохтар': [37.8364, 68.78],
    'Кӯлоб': [37.9145, 69.7843], 'Ҳисор': [38.5253, 68.5547], 'Турсунзода': [38.5106, 68.2328],
    'Вахдат': [38.555, 69.0222], 'Истаравшан': [39.9142, 69.0027], 'Панҷакент': [39.495, 67.609],
    'Конибодом': [40.2894, 70.4217], 'Хоруғ': [37.4897, 71.5531]
  };
  var VEHICLES = {
    gazel: { name: 'ГАЗель', cap: 1500, base: 40, perKm: 3.2, desc: 'то 1 500 кг' },
    furgon: { name: 'Фургон', cap: 3500, base: 70, perKm: 4.6, desc: 'то 3 500 кг' },
    kamaz: { name: 'Овох / Камаз', cap: 15000, base: 150, perKm: 8.5, desc: 'то 15 000 кг' }
  };
  var PAYMENTS = {
    cash: { name: 'Нақд', icon: 'wallet' },
    alif: { name: 'Карта / Алиф', icon: 'card' },
    dcity: { name: 'Душанбе Сити', icon: 'building' }
  };
  var STEPS = [
    ['pending', 'Интизорӣ', 'clock'], ['accepted', 'Қабул шуд', 'check'],
    ['transit', 'Дар роҳ', 'truck'], ['completed', 'Анҷом ёфт', 'pkg']
  ];
  var KEY = 'borgo.orders.v1', ME = 'borgo.me.v1';

  /* ---------- State (closed over) ---------- */
  var me = (function () {
    try { var v = localStorage.getItem(ME); if (v) return v; v = 'u' + Math.random().toString(36).slice(2, 10); localStorage.setItem(ME, v); return v; }
    catch (e) { return 'u' + Math.random().toString(36).slice(2, 10); }
  })();
  var orders = load();
  var ui = { role: 'customer', vehicle: 'gazel', pay: 'cash' };

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(orders)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Math.round(n).toLocaleString('ru-RU') + ' сомонӣ'; }

  /* ---------- Pricing ---------- */
  function distance(a, b) {
    if (!CITIES[a] || !CITIES[b] || a === b) return 0;
    var R = 6371, r = Math.PI / 180, A = CITIES[a], B = CITIES[b];
    var dLat = (B[0] - A[0]) * r, dLon = (B[1] - A[1]) * r;
    var h = Math.sin(dLat / 2) ** 2 + Math.cos(A[0] * r) * Math.cos(B[0] * r) * Math.sin(dLon / 2) ** 2;
    return Math.round(2 * R * Math.asin(Math.sqrt(h)) * 1.4); // коэффитсиенти роҳ
  }
  function price(from, to, veh, kg) {
    var km = distance(from, to), v = VEHICLES[veh];
    if (!km || !kg || kg <= 0) return null;
    var load = 1 + Math.min(kg / v.cap, 1) * 0.25;
    return { km: km, total: Math.round((v.base + km * v.perKm) * load / 5) * 5 };
  }

  /* ---------- Toasts ---------- */
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast bg-ink text-white text-sm rounded-lg px-4 py-3 shadow-lg flex items-center gap-2';
    t.innerHTML = icon('check', 'w-4 h-4 text-road shrink-0') + '<span>' + esc(msg) + '</span>';
    $('toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  /* ---------- Shared UI pieces ---------- */
  function ago(ts) {
    var m = Math.floor((Date.now() - ts) / 60000);
    return m < 1 ? 'ҳоло' : m < 60 ? m + ' дақ. пеш' : Math.floor(m / 60) + ' соат пеш';
  }
  function stepper(status) {
    var idx = STEPS.findIndex(function (s) { return s[0] === status; });
    return '<ol class="flex items-center mt-3">' + STEPS.map(function (s, i) {
      var done = i <= idx, last = i === STEPS.length - 1;
      return '<li class="flex items-center ' + (last ? '' : 'flex-1') + '"><div class="flex flex-col items-center gap-1 w-14 shrink-0">' +
        '<span class="w-8 h-8 rounded-full flex items-center justify-center ' + (done ? 'bg-road text-ink' : 'bg-slate-100 text-slate-400') + '">' + icon(s[2], 'w-4 h-4') + '</span>' +
        '<span class="text-[11px] leading-tight text-center ' + (done ? 'font-semibold' : 'text-slate-400') + '">' + s[1] + '</span></div>' +
        (last ? '' : '<span class="flex-1 h-0.5 -mt-5 ' + (i < idx ? 'bg-road' : 'bg-slate-200') + '"></span>') + '</li>';
    }).join('') + '</ol>';
  }
  function routeLine(o) {
    return '<div class="flex items-center gap-2 font-semibold">' + esc(o.from) + icon('arrow', 'w-4 h-4 text-slate-400') + esc(o.to) + '</div>';
  }
  function meta(o) {
    return '<div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-600 mt-1.5">' +
      '<span class="flex items-center gap-1">' + icon('route', 'w-3.5 h-3.5') + o.km + ' км</span>' +
      '<span class="flex items-center gap-1">' + icon('truck', 'w-3.5 h-3.5') + esc(VEHICLES[o.vehicle].name) + '</span>' +
      '<span class="flex items-center gap-1">' + icon('weight', 'w-3.5 h-3.5') + o.weight + ' кг</span>' +
      '<span class="flex items-center gap-1">' + icon(PAYMENTS[o.pay].icon, 'w-3.5 h-3.5') + esc(PAYMENTS[o.pay].name) + '</span></div>' +
      (o.note ? '<p class="text-sm text-slate-500 mt-2 border-l-2 border-slate-200 pl-2">' + esc(o.note) + '</p>' : '');
  }
  function empty(text, sub) {
    return '<div class="rounded-xl border border-dashed border-slate-300 bg-white/60 p-8 text-center text-slate-500">' +
      '<div class="flex justify-center mb-2 text-slate-400">' + icon('inbox', 'w-8 h-8') + '</div>' +
      '<p class="font-semibold text-slate-700">' + text + '</p><p class="text-sm mt-1">' + sub + '</p></div>';
  }

  /* ---------- Customer view ---------- */
  function initForm() {
    var opts = Object.keys(CITIES).map(function (c) { return '<option>' + c + '</option>'; }).join('');
    $('from').innerHTML = opts; $('to').innerHTML = opts;
    $('from').value = 'Душанбе'; $('to').value = 'Хуҷанд';
    document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = icon(el.dataset.i, 'w-4 h-4 text-slate-500'); });
    $('logo').innerHTML = icon('truck', 'w-5 h-5');
    renderChoices();
    ['from', 'to', 'weight'].forEach(function (id) { $(id).addEventListener('input', updatePrice); });
    $('order-form').addEventListener('submit', submitOrder);
    updatePrice();
  }
  function renderChoices() {
    $('vehicles').innerHTML = Object.keys(VEHICLES).map(function (k) {
      var v = VEHICLES[k], on = ui.vehicle === k;
      return '<button type="button" data-v="' + k + '" aria-pressed="' + on + '" class="text-left rounded-lg border-2 p-3 ' + (on ? 'border-ink bg-road/20' : 'border-slate-200 hover:border-slate-400') + '">' +
        icon('truck', 'w-5 h-5 mb-1.5') + '<div class="font-semibold text-sm">' + v.name + '</div><div class="text-xs text-slate-500">' + v.desc + '</div></button>';
    }).join('');
    $('payments').innerHTML = Object.keys(PAYMENTS).map(function (k) {
      var p = PAYMENTS[k], on = ui.pay === k;
      return '<button type="button" data-p="' + k + '" aria-pressed="' + on + '" class="rounded-lg border-2 p-3 flex items-center gap-2 text-sm font-semibold ' + (on ? 'border-ink bg-road/20' : 'border-slate-200 hover:border-slate-400') + '">' +
        icon(p.icon, 'w-4 h-4') + p.name + '</button>';
    }).join('');
    $('weight-hint').textContent = 'Ҳадди аксар барои ' + VEHICLES[ui.vehicle].name + ': ' + VEHICLES[ui.vehicle].cap.toLocaleString('ru-RU') + ' кг';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-v],[data-p]');
    if (!b) return;
    if (b.dataset.v) ui.vehicle = b.dataset.v; else ui.pay = b.dataset.p;
    renderChoices(); updatePrice();
  });
  function currentPrice() {
    return price($('from').value, $('to').value, ui.vehicle, parseFloat($('weight').value));
  }
  function updatePrice() {
    var p = currentPrice(), same = $('from').value === $('to').value;
    $('price').textContent = p ? fmt(p.total) : '—';
    $('price-meta').textContent = p ? 'Масофаи тахминӣ: ' + p.km + ' км · ' + VEHICLES[ui.vehicle].name
      : same ? 'Нуқтаҳои баромад ва расидан гуногун бошанд' : 'Вазни борро ворид кунед';
  }
  function submitOrder(e) {
    e.preventDefault();
    var err = $('form-error'), kg = parseFloat($('weight').value), p = currentPrice(), v = VEHICLES[ui.vehicle];
    var msg = '';
    if ($('from').value === $('to').value) msg = 'Нуқтаи баромад ва расидан набояд яксон бошанд.';
    else if (!kg || kg <= 0) msg = 'Вазни борро ворид кунед.';
    else if (kg > v.cap) msg = 'Вазн аз иҷозаи ' + v.name + ' (' + v.cap + ' кг) зиёд аст. Мошини калонтарро интихоб кунед.';
    err.textContent = msg; err.classList.toggle('hidden', !msg);
    if (msg || !p) return;
    orders.unshift({
      id: 'BG-' + Date.now().toString(36).toUpperCase().slice(-5), from: $('from').value, to: $('to').value,
      km: p.km, vehicle: ui.vehicle, weight: kg, note: $('note').value.trim(), pay: ui.pay,
      price: p.total, status: 'pending', createdAt: Date.now(), customerId: me, driverId: null
    });
    save(); $('weight').value = ''; $('note').value = '';
    updatePrice(); renderAll(); toast('Фармоиш ба рӯйхати фаъол илова шуд');
  }
  function renderMyOrders() {
    var mine = orders.filter(function (o) { return o.customerId === me; });
    $('my-orders').innerHTML = mine.length ? mine.map(function (o) {
      var cancel = o.status === 'pending'
        ? '<button data-cancel="' + o.id + '" class="text-sm text-red-600 font-semibold flex items-center gap-1 hover:underline">' + icon('x', 'w-4 h-4') + 'Бекор кардан</button>' : '';
      return '<article class="bg-white rounded-xl border border-slate-200 p-4">' +
        '<div class="flex justify-between items-start gap-2"><div>' + routeLine(o) + '</div><span class="text-xs text-slate-400 shrink-0">' + o.id + ' · ' + ago(o.createdAt) + '</span></div>' +
        meta(o) + stepper(o.status) +
        '<div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100"><span class="font-bold">' + fmt(o.price) + '</span>' + cancel + '</div></article>';
    }).join('') : empty('Ҳоло фармоиш нест', 'Формаи фармоишро пур кунед — он дар ин ҷо пайгирӣ мешавад.');
  }

  /* ---------- Driver view ---------- */
  function renderDriver() {
    var pending = orders.filter(function (o) { return o.status === 'pending'; });
    var mineActive = orders.find(function (o) { return o.driverId === me && (o.status === 'accepted' || o.status === 'transit'); });
    var done = orders.filter(function (o) { return o.driverId === me && o.status === 'completed'; });
    var earned = done.reduce(function (s, o) { return s + o.price; }, 0);

    $('driver-stats').innerHTML = [
      ['list', 'Дар интизорӣ', pending.length], ['pkg', 'Анҷомёфта', done.length], ['coins', 'Даромад', fmt(earned)]
    ].map(function (s) {
      return '<div class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4"><div class="flex items-center gap-1.5 text-xs sm:text-sm text-slate-500">' + icon(s[0], 'w-4 h-4') + s[1] +
        '</div><div class="text-base sm:text-xl font-bold mt-1 break-words">' + s[2] + '</div></div>';
    }).join('');

    $('active-panel').innerHTML = mineActive ? (function (o) {
      var next = o.status === 'accepted'
        ? '<button data-adv="' + o.id + '" class="bg-road text-ink font-bold rounded-lg px-5 py-3 flex items-center justify-center gap-2 w-full sm:w-auto">' + icon('play', 'w-4 h-4') + 'Оғози роҳ</button>'
        : '<button data-adv="' + o.id + '" class="bg-emerald-600 text-white font-bold rounded-lg px-5 py-3 flex items-center justify-center gap-2 w-full sm:w-auto">' + icon('check', 'w-4 h-4') + 'Анҷом додани фармоиш</button>';
      return '<div class="bg-white rounded-xl border-2 border-ink p-5"><div class="flex justify-between items-start gap-2"><h2 class="font-bold">Фармоиши ҷорӣ</h2><span class="text-xs text-slate-400">' + o.id + '</span></div>' +
        '<div class="mt-2">' + routeLine(o) + '</div>' + meta(o) + stepper(o.status) +
        '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mt-4 pt-4 border-t border-slate-100"><span class="text-xl font-bold">' + fmt(o.price) + '</span>' + next + '</div></div>';
    })(mineActive) : '';

    $('live-count').textContent = pending.length + ' фармоиш';
    $('live-orders').innerHTML = pending.length ? pending.map(function (o) {
      return '<article class="bg-white rounded-xl border border-slate-200 p-4 flex flex-col">' +
        '<div class="flex justify-between items-start gap-2">' + routeLine(o) + '<span class="text-xs text-slate-400 shrink-0">' + ago(o.createdAt) + '</span></div>' + meta(o) +
        '<div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-100 gap-3"><span class="text-lg font-bold">' + fmt(o.price) + '</span>' +
        '<button data-accept="' + o.id + '" class="bg-ink text-white font-semibold rounded-lg px-4 py-2.5 flex items-center gap-2 hover:bg-slate-800">' + icon('check', 'w-4 h-4') + 'Қабул кардани фармоиш</button></div></article>';
    }).join('') : '<div class="md:col-span-2">' + empty('Фармоиши фаъол нест', 'Фармоишҳои нав худкор дар ин ҷо пайдо мешаванд. Барои санҷиш, ба реҷаи «Соҳиби бор» гузашта фармоиш диҳед.') + '</div>';
  }

  /* ---------- Actions ---------- */
  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-cancel]'))) {
      var id = t.dataset.cancel, o = orders.find(function (x) { return x.id === id; });
      if (o && o.status === 'pending') { orders = orders.filter(function (x) { return x.id !== id; }); save(); renderAll(); toast('Фармоиш бекор шуд'); }
    } else if ((t = e.target.closest('[data-accept]'))) {
      var busy = orders.some(function (x) { return x.driverId === me && (x.status === 'accepted' || x.status === 'transit'); });
      if (busy) { toast('Аввал фармоиши ҷориро анҷом диҳед'); return; }
      orders = load(); // иттилооти охирин
      var a = orders.find(function (x) { return x.id === t.dataset.accept; });
      if (!a || a.status !== 'pending') { toast('Ин фармоишро ронандаи дигар қабул кард'); renderAll(); return; }
      a.status = 'accepted'; a.driverId = me; save(); renderAll(); toast('Фармоиш қабул шуд');
    } else if ((t = e.target.closest('[data-adv]'))) {
      var c = orders.find(function (x) { return x.id === t.dataset.adv; });
      if (!c) return;
      c.status = c.status === 'accepted' ? 'transit' : 'completed'; save(); renderAll();
      toast(c.status === 'transit' ? 'Бор дар роҳ аст' : 'Фармоиш анҷом ёфт');
    }
  });

  /* ---------- Role toggle ---------- */
  function renderTabs() {
    var cfg = [['customer', 'Соҳиби бор', 'pkg'], ['driver', 'Ронанда', 'truck']];
    cfg.forEach(function (c) {
      var b = $('tab-' + c[0]), on = ui.role === c[0];
      b.innerHTML = icon(c[2], 'w-4 h-4') + '<span>' + c[1] + '</span>';
      b.className = 'px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold flex items-center gap-2 ' + (on ? 'bg-road text-ink' : 'text-white/80 hover:text-white');
      b.setAttribute('aria-selected', on);
    });
    $('view-customer').classList.toggle('hidden', ui.role !== 'customer');
    $('view-driver').classList.toggle('hidden', ui.role !== 'driver');
  }
  $('tab-customer').addEventListener('click', function () { ui.role = 'customer'; renderAll(); });
  $('tab-driver').addEventListener('click', function () { ui.role = 'driver'; renderAll(); });

  function renderAll() { renderTabs(); renderMyOrders(); renderDriver(); }

  /* ---------- Live sync (дигар ҷадвалҳо / дастгоҳҳои ҳамон браузер) ---------- */
  window.addEventListener('storage', function (e) {
    if (e.key === KEY) {
      var before = orders.filter(function (o) { return o.status === 'pending'; }).length;
      orders = load(); renderAll();
      var after = orders.filter(function (o) { return o.status === 'pending'; }).length;
      if (ui.role === 'driver' && after > before) toast('Фармоиши нав омад');
    }
  });
  setInterval(function () { renderMyOrders(); renderDriver(); }, 30000);

  initForm(); renderAll();
})();
</script>
</body>
</html>
